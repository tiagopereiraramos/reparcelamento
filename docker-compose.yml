version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: rpa_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: rpa_user
      MONGO_INITDB_ROOT_PASSWORD: rpa_password_2024
      MONGO_INITDB_DATABASE: rpa_system
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
      - ./mongo-backups:/backups
    networks:
      - rpa_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Dashboard Streamlit (opcional)
  dashboard:
    image: python:3.11-slim
    container_name: rpa_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app
    working_dir: /app
    command: >
      sh -c "pip install streamlit &&
        streamlit run dashboard_notificacoes.py --server.port 8501 --server.address 0.0.0.0"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - rpa_network
    profiles:
      - dashboard

volumes:
  mongodb_data:
    driver: local

networks:
  rpa_network:
    driver: bridge 